[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "xh-detect"
version = "0.1.0"
description = "XH-202625 optical remote-sensing detection baseline"
requires-python = ">=3.11,<3.13"
dependencies = [
  "gradio==6.19.0",
  "numpy>=1.26,<3",
  "opencv-python>=4.10,<5",
  "pillow>=10,<13",
  "pyyaml>=6,<7",
  "rich>=13,<15",
  "shapely>=2,<3",
  "typer>=0.16,<1",
  "ultralytics==8.4.71",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
xh-detect = "xh_detect.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/xh_detect"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
